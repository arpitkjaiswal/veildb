[project]
name = "cryptalis"
version = "0.1.0a1"
description = "Manifest-first searchable encryption for PostgreSQL applications"
maintainers = [{ name = "arpitkjaiswal" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography==50.0.2",
    "greenlet==3.5.6",
    "SQLAlchemy==2.1.3",
    "psycopg[binary]==3.3.6",
]

[project.urls]
Homepage = "https://github.com/arpitkjaiswal/veildb"
Documentation = "https://github.com/arpitkjaiswal/veildb/blob/main/docs/README.md"
Repository = "https://github.com/arpitkjaiswal/veildb"
Issues = "https://github.com/arpitkjaiswal/veildb/issues"

[project.scripts]
cryptalis = "cryptalis.cli:main"

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "packaging>=26.3",
    "pytest",
    "pytest-xdist>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["prefix_qualification: isolated synthetic engineering evidence; no capability admission"]

[project.optional-dependencies]
sqlmodel = ["sqlmodel==0.0.48"]
openbao = [
    "hvac==2.4.0",
]
gcp = [
    "google-cloud-kms==3.18.0",
    "google-crc32c==1.9.0",
]
